name: Project scaffold quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-scaffold-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate documentation, configuration, and scripts
        shell: pwsh
        run: ./scripts/Test-Template.ps1
